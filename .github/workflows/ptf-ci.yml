name: Pluggable Table Format CI

on:
  push:
    branches:
      - "iceberg-v3-ptf-*"
  pull_request:
    branches:
      - "iceberg-v3-ptf-*"
  workflow_dispatch:

concurrency:
  group: ptf-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # apache/hudi master ac6456aca657 (2026-09-18) plus the update-as-delete-insert writer mode from
  # yihua/hudi mor-update-as-delete-insert, which the merge-on-read deletion-vector tests need and
  # apache/hudi does not have yet; hudi.version in pom.xml (1.3.0-SNAPSHOT) is built from it
  HUDI_REPOSITORY: https://github.com/voonhous/hudi.git
  HUDI_COMMIT: b400ce124fd810d2da5b4fa78c50fe7c819819c8
  MAVEN_OPTS: -Xmx4g -Xss4m
  PTF_MAVEN_ARGS: -B -ntp -Dmaven.build.cache.enabled=false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 11 (Hudi build) and JDK 17 (XTable)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            11
            17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/apache/hudi
          key: ptf-m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ptf-m2-${{ runner.os }}-

      - name: Cache the Hudi build
        id: hudi-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/apache/hudi
          key: ptf-hudi-${{ runner.os }}-${{ env.HUDI_COMMIT }}-spark3.4-scala2.12

      - name: Build Hudi at ${{ env.HUDI_COMMIT }} (Spark 3.4, Scala 2.12)
        if: steps.hudi-cache.outputs.cache-hit != 'true'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
        # cloned outside the workspace so the Apache RAT check of this project does not scan it
        run: |
          HUDI_DIR="$RUNNER_TEMP/hudi"
          git init --quiet "$HUDI_DIR"
          git -C "$HUDI_DIR" fetch --quiet --depth 1 "$HUDI_REPOSITORY" "$HUDI_COMMIT"
          git -C "$HUDI_DIR" checkout --quiet FETCH_HEAD
          mvn $PTF_MAVEN_ARGS -f "$HUDI_DIR/pom.xml" install -DskipTests -Dscala-2.12 -Dspark3.4 \
            -pl packaging/hudi-spark-bundle,hudi-utilities,hudi-client/hudi-java-client -am

      - name: Build the modules the Iceberg table format depends on
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./mvnw $PTF_MAVEN_ARGS install -DskipTests -pl xtable-hudi-support/xtable-iceberg-pluggable-tf -am

      - name: Unit tests
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./mvnw $PTF_MAVEN_ARGS test -pl xtable-api,xtable-hudi-support/xtable-hudi-support-utils,xtable-core

      - name: Iceberg table format tests
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./mvnw $PTF_MAVEN_ARGS verify -pl xtable-hudi-support/xtable-iceberg-pluggable-tf

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
